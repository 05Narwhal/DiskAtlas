name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Package list derived from the gpui 0.2.2 dependency tree (default
      # features: x11 + wayland). Only libraries linked at build or link time
      # are needed; wayland, fontconfig and vulkan are dlopen'd at runtime.
      # Revisit this list whenever gpui is bumped.
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # Short smoke run of the cargo-fuzz targets in fuzz/. Needs nightly for
  # libFuzzer's sanitizer flags. The engine has no GPUI dependency, so no
  # system packages are needed. Seeds come from the HFS+ test volume builder.
  fuzz:
    name: fuzz (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Generate seed corpus
        env:
          DISK_ATLAS_FUZZ_SEEDS: ${{ github.workspace }}/fuzz/seeds
        run: cargo test -p disk-atlas-lib --lib write_fuzz_seeds -- --ignored

      - name: Fuzz
        run: |
          # -max_len must exceed libFuzzer's 4096 default or the HFS+ seeds
          # are truncated.
          # Absolute corpus paths: cargo-fuzz may run the fuzzer from fuzz/.
          for target in probe partition_map hfsplus_volume_header hfsplus_mount hfsplus_journal decmpfs udif sparseimage plist search_index_load; do
            corpus="$GITHUB_WORKSPACE/fuzz/corpus/$target"
            seeds="$GITHUB_WORKSPACE/fuzz/seeds/$target"
            mkdir -p "$corpus" "$seeds"
            cargo fuzz run --fuzz-dir fuzz "$target" "$corpus" "$seeds" \
              -- -max_total_time=60 -max_len=1048576
          done

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
