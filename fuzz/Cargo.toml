[package]
name = "disk-atlas-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
disk-atlas-lib = { path = "../crates/lib" }

# Keeps the fuzz crate out of the main workspace, so the workspace builds on
# stable without it.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "probe"
path = "fuzz_targets/probe.rs"
test = false
doc = false
bench = false

